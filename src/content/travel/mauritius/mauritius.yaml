    occasion: Short surprise escape from Dubai; Mauritius was chosen partly because it did not require a visa for entry.
    notes: The trip was deliberately short and focused mainly on relaxing at the resort, with a few tourist outings. We drove around the island ourselves after collecting the rental car at the airport. Mauritius felt similar to Seychelles in its scenic beauty, but with better infrastructure. We unexpectedly found Indian temples and enjoyed finding familiar food, including idli and dosa. The hidden waterfall was reached after following a Google Maps nearby attraction through sugarcane plantations; we took a leap of faith, found the falls clean and almost deserted, and swam in the pool. In hindsight, the resort deserved even more time.
