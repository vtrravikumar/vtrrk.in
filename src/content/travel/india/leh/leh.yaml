    highlights:
      - Trip with Manish planned a year earlier and postponed after the 2010 Leh cloudburst
      - Early-season visit in April when many mountain passes and attractions were still closed
      - Inner Line Permits for Khardung La, Nubra and Pangong Tso
      - First experience of Khardung La and mild high-altitude headache
      - Overnight in Hunder and camel ride
      - Exceptionally clear, dark night sky with visible stars in Hunder
      - Maitreya Buddha and Diskit Monastery in Nubra Valley
      - Pangong Tso was initially frozen, so the itinerary was changed and the lake visited after returning from Nubra
      - Pangong Tso experience after the excitement created by the movie 3 Idiots
      - Renting a bike in Leh and riding to the Zanskar River and Shanti Stupa
      - Thiksey Monastery
      - Hotel Tsokar adjusted the booking for the days spent away and charged only for the nights actually stayed, despite luggage being left in the room
