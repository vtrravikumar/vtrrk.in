    occasion: New Year
    notes: Thailand was chosen because of the ease of visa on arrival for Indian travellers. The trip took place soon after the death of King Bhumibol Adulyadej in October 2016, and the country was in mourning. New Year celebrations around CentralWorld were muted, with no fireworks or countdown experienced despite many people wanting to celebrate.
