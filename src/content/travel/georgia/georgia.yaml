    notes: The trip was chosen in part because Georgia offered visa on arrival. It was the first personal international trip for the couple. The train journey to Batumi was an impromptu decision. Communication was sometimes difficult because few local people spoke English, so gestures and sign language often became the solution. Despite the unpleasant immigration experience on arrival, the Georgians encountered during the trip were warm and welcoming, with a noticeable affection for India and old Hindi cinema. Some could sing songs from Raj Kapoor films such as Mera Naam Joker, reflecting the lingering Soviet-era connection with Indian cinema.
