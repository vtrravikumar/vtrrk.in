    stays: []
    occasion: Birthday
    notes: The original plan was to rent a car and drive around Sri Lanka. The economic crisis and resulting fuel shortages made the rental company unable to guarantee fuel availability, so the plan was changed immediately after arrival. A local Uber driver offered to stay with us for the entire journey, drive us around and finally drop us at the airport. His local knowledge and confidence in finding fuel solved the transport problem for the remainder of the trip. During the journey, the Sri Lankan rupee depreciated noticeably, making many things feel increasingly inexpensive when converted from foreign currency. The trip also reinforced how easy it is to overlook destinations that are geographically close to home; Sri Lanka is only a short flight from Chennai.
