    occasion: Client visit combined with company headquarters visit and personal travel
    notes: The trip combined a client visit with a visit to the company's headquarters in Norwalk, Connecticut. The user travelled with Pragati, making this her first international trip. Work occupied much of the stay, while evenings, weekends and selected holidays were used for sightseeing. The first New York outing was on Valentine's Day, 14 February, when Times Square was filled with red decorations. A second New York visit on 7 March included Central Park, the Empire State Building, Times Square and the site where the Twin Towers had stood. The couple experienced their first snowfall while staying at the Homestead and went outside to enjoy it. Shopping was also part of the trip, including clothes, handbags and a Citizen Eco-Drive watch bought for Pragati, which she still has. A memorable meal was pizza near the Empire State Building, though after so many years it is impossible to know whether it tasted especially good or whether hunger made it seem that way. The trip is remembered particularly for the help and hospitality of colleagues who picked them up, dropped them back and helped them experience the area while the user was working.
