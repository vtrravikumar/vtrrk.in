    occasion: Short surprise trip from Dubai
    notes: Suzuki Vitara 3-door (or similar) rented from Absolute Cars with airport pickup and drop-off at SEZ. Spent most of the trip driving around Mahé. Cool climate with occasional drizzle. The Indian community, particularly people of South Indian origin, and the South Indian-style Vinayagar temple were an unexpected connection. In hindsight, the trip could have been longer to spend more time at the hotel and beach and try activities such as snorkelling.